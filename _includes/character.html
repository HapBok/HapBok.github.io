{% assign character_dimensions = site.data.characters[include.name] %}
<img class="character {{ include.class }}" src="{{ '/assets/images/characters/' | append: include.name | append: '.png' | relative_url }}" width="{{ character_dimensions.width | default: 1619 }}" height="{{ character_dimensions.height | default: 971 }}" alt="{% case include.name %}{% when 'coding' %}함께 노트북을 보는 해피와 복순이{% when 'reading' %}책과 노트를 읽는 해피와 복순이{% when 'research' %}돋보기와 폴더를 살피는 해피와 복순이{% when 'terminal' %}터미널을 살피는 해피와 복순이{% when 'resting' %}함께 쉬는 해피와 복순이{% when 'celebrating' %}기뻐하는 해피와 복순이{% else %}빈 폴더를 살피는 해피와 복순이{% endcase %}" loading="lazy" decoding="async">
