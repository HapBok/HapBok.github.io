<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="theme-color" content="#f7f8fa">
<title>{% if page.title and page.url != '/' %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
<link rel="canonical" href="{{ page.url | absolute_url }}">
{% assign asset_version = site.github.build_revision %}
{% unless asset_version %}{% assign asset_version = site.time | date: '%s' %}{% endunless %}
<link rel="preload" href="{{ '/assets/fonts/pretendard/PretendardVariable.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ asset_version }}">
<script type="module" src="{{ '/assets/js/main.js' | relative_url }}?v={{ asset_version }}"></script>
