<header class="editor-chrome">
  <button class="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="site-explorer" aria-label="탐색기 열기">
    <span></span><span></span><span></span>
  </button>

  <div class="editor-tab" aria-current="page">
    <span class="file-icon" aria-hidden="true">▱</span>
    <span>{{ page.file_name | default: 'welcome.md' }}</span>
  </div>

  <div class="editor-breadcrumb" aria-label="현재 문서 경로">
    <span>HAPBOK-LOG</span>
    {% if page.directory_label %}
      <span aria-hidden="true">›</span>
      <span>{{ page.directory_label }}</span>
    {% endif %}
    <span aria-hidden="true">›</span>
    <strong>{{ page.file_name | default: 'welcome.md' }}</strong>
  </div>
</header>
