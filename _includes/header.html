<header class="site-header"><div class="header-inner">
<a class="wordmark" href="{{ '/' | relative_url }}" aria-label="HapBok 홈">HapBok<span class="wordmark-dot" aria-hidden="true">.</span></a>
<nav class="header-nav" aria-label="주요 메뉴">
<a href="{{ '/notes/' | relative_url }}"{% if page.layout == 'archive' or page.layout == 'category' or page.layout == 'post' %} aria-current="page"{% endif %}>기록</a>
<a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>소개</a>
</nav>
<div class="header-actions">
<a class="icon-button" href="{{ '/notes/#search' | relative_url }}" aria-label="기록 검색">{% include icon.html name="search" %}</a>
<a class="icon-button" href="https://github.com/HapBok" target="_blank" rel="noopener noreferrer" aria-label="GitHub 프로필 (새 탭)">{% include icon.html name="github" %}</a>
<button class="icon-button menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="메뉴 열기" hidden>{% include icon.html name="menu" %}</button>
</div>
</div></header>
