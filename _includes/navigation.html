<aside class="site-sidebar" id="site-menu" aria-label="블로그 메뉴">
<div class="sidebar-heading"><span>둘러보기</span><button class="icon-button menu-close" type="button" aria-label="메뉴 닫기" hidden>{% include icon.html name="close" %}</button></div>
<p class="sidebar-intro">보안과 개발을<br>공부하고 기록합니다.</p>
<nav aria-label="페이지">
<a class="sidebar-link" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>홈</a>
<a class="sidebar-link" href="{{ '/notes/' | relative_url }}"{% if page.url == '/notes/' %} aria-current="page"{% endif %}>모든 기록</a>
<a class="sidebar-link" href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>소개</a>
</nav>
<nav class="topic-nav" aria-label="주제별 기록">
<p class="nav-label">주제</p>
{% for category in site.data.categories %}<a class="sidebar-link" href="{{ category.url | relative_url }}"{% if page.category_key == category.key %} aria-current="page"{% endif %}>{{ category.title }}</a>{% endfor %}
</nav>
<p class="sidebar-signature">Happy + Boksoon<br><span>= HapBok</span></p>
</aside>
