<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#content">본문으로 건너뛰기</a>
    {% include header.html %}
    <main id="content" class="site-main{% unless page.url == '/' %} inner-page{% endunless %}">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
