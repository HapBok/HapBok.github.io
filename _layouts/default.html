<!doctype html>
<html lang="ko">
<head>{% include head.html %}</head>
{% assign has_sidebar = false %}
{% if page.layout == 'category' or page.layout == 'archive' or page.layout == 'post' %}{% assign has_sidebar = true %}{% endif %}
<body class="{% if has_sidebar %}layout--archive{% else %}layout--reading{% endif %}" data-search-url="{{ '/search.json' | relative_url }}" data-baseurl="{{ site.baseurl }}" data-page-kind="{{ page.layout }}">
<a class="skip-link" href="#content">본문으로 건너뛰기</a>
{% include header.html %}
<div class="page-frame{% if has_sidebar %} page-frame--archive{% endif %}">
{% include navigation.html %}
<main id="content" class="main-content" tabindex="-1">{{ content }}</main>
</div>
{% include footer.html %}
<button class="menu-scrim" type="button" tabindex="-1" aria-label="메뉴 닫기" hidden></button>
<dialog class="image-viewer" aria-label="이미지 크게 보기" data-image-viewer>
<button class="viewer-close" type="button" aria-label="이미지 닫기">{% include icon.html name="close" %}</button>
<img alt=""><p class="viewer-caption"></p>
</dialog>
</body>
</html>
