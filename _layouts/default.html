<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </head>
  {% assign active_category = page.category_key | default: page.categories.first %}
  <body data-page-kind="{{ page.layout | default: 'page' }}" data-category="{{ active_category | default: '' }}">
    <a class="skip-link" href="#content">본문으로 건너뛰기</a>

    <div class="app-shell">
      {% include app/activity-bar.html %}
      {% include app/explorer.html %}

      <section class="app-workspace" aria-label="문서 작업 영역">
        {% include header.html %}
        <main id="content" class="editor-content{% unless page.url == '/' %} editor-content--inner{% endunless %}">
          {{ content }}
        </main>
        {% include footer.html %}
      </section>

      {% include app/outline.html %}
    </div>

    <button class="explorer-scrim" type="button" aria-label="탐색기 닫기" tabindex="-1"></button>
  </body>
</html>
